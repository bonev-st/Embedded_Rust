[package]
name = "l562-rtt-demo"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
defmt = "1.0"
defmt-rtt = "1.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }
# PAC for the STM32L562 (default features: rt, critical-section)
stm32l5 = { version = "0.16.0", features = ["stm32l562"] }

[[bin]]
name = "l562-rtt-demo"
test = false
bench = false

[profile.dev]
debug = 2
opt-level = 0      # every source line keeps a breakpoint location (opt-level 1 dropped more than half)

# dependencies (cortex-m, defmt, PAC) stay optimized: smaller binary, nobody steps into them
[profile.dev.package."*"]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2          # symbols do not end up in flash
lto = true
opt-level = "s"
